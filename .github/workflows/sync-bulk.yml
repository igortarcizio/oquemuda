name: Importar arquivos anuais da Câmara para o Supabase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-bulk.yml'
      - 'scripts/sync_bulk.py'
  schedule:
    - cron: '53 5 * * *'
concurrency:
  group: sync-bulk
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe
        run: python -m py_compile scripts/sync_bulk.py
      - name: Atualizar fichas com arquivos oficiais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u scripts/sync_bulk.py

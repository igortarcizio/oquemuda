name: Validar layout dos títulos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify_title_layout.mjs'
      - 'dados/revisao-titulos-lote-013.json'
      - 'dados/revisao-titulos-regras-011.json'
      - '.github/workflows/title-layout.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify_title_layout.mjs dados/revisao-titulos-lote-013.json dados/revisao-titulos-regras-011.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacao-layout-titulos
          path: reports/title-layout.json
          retention-days: 30

name: Atualizar catálogo legislativo
on:
  push:
    paths:
      - '.github/workflows/atualizar.yml'
      - 'scripts/atualizar_catalogo.py'
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
    - cron: '15 20 * * *'
permissions:
  contents: write
concurrency:
  group: catalogo-legislativo
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar API oficial e gerar catálogo completo por ano e tipo
        env:
          OBM_YEARS: '2026,2025,2024,2023,2022'
        run: python scripts/atualizar_catalogo.py
      - name: Publicar novo índice sem perder a base em caso de erro
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/catalogo.js
          if ! git diff --cached --quiet; then
            git commit -m 'Atualização automática do catálogo legislativo'
            git pull --rebase origin main
            git push
          fi

name: Atualizar catálogo legislativo
on:
  push:
    paths:
      - '.github/workflows/atualizar.yml'
      - 'scripts/atualizar_catalogo.py'
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
    - cron: '15 20 * * *'
permissions:
  contents: write
concurrency:
  group: catalogo-snapshot-v4
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar reserva recente da API (consulta principal funciona ao vivo)
        run: python scripts/atualizar_catalogo.py
      - name: Publicar cache com sincronização segura
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/obm"
          cp dados/catalogo.js "$RUNNER_TEMP/obm/catalogo.js"
          cp dados/deputados-partidos.js "$RUNNER_TEMP/obm/deputados-partidos.js"
          for tentativa in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/obm/catalogo.js" dados/catalogo.js
            cp "$RUNNER_TEMP/obm/deputados-partidos.js" dados/deputados-partidos.js
            git add dados/catalogo.js dados/deputados-partidos.js
            if git diff --cached --quiet; then
              echo "Cache já estava atualizado."
              exit 0
            fi
            git commit -m 'Atualização automática do catálogo e partidos'
            if git push origin HEAD:main; then
              echo "Cache atualizado e publicado."
              exit 0
            fi
            echo "::warning::O repositório mudou durante a publicação. Reaplicando arquivos gerados (tentativa ${tentativa})."
            sleep 3
          done
          echo "::error::Não foi possível publicar após seis tentativas."
          exit 1


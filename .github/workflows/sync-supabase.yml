name: Sincronizar proposições com Supabase
on:
  push:
    paths:
      - '.github/workflows/sync-supabase.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
concurrency:
  group: sync-supabase
  cancel-in-progress: false
permissions:
  contents: read
  actions: write   # para disparar os resumos por IA das propostas novas
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe do sincronizador
        run: python -m py_compile scripts/sync_supabase.py
      - name: Sincronizar base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py
      - name: Gerar resumos das propostas novas
        # O cron do resumos-ia roda poucas vezes por dia na prática; sem isto, proposta nova
        # fica horas com o título automático (ementa quase inteira) até ganhar o título da IA.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run resumos-ia.yml --repo "$GITHUB_REPOSITORY" --ref main
